<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='14' cy='14' r='10' fill='%234285F4'/%3E%3Ccircle cx='34' cy='14' r='10' fill='%23EA4335'/%3E%3Ccircle cx='14' cy='34' r='10' fill='%23FBBC05'/%3E%3Ccircle cx='34' cy='34' r='10' fill='%2334A853'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo"><span class="g g-blue">T</span><span class="g g-red">a</span><span class="g g-yellow">s</span><span class="g g-blue">k</span><span class="g g-green">F</span><span class="g g-red">l</span><span class="g g-yellow">o</span><span class="g g-blue">w</span></h1>
            <p class="subtitle">Simple task management</p>
        </header>
        <div class="rainbow-bar"></div>

        <div class="task-form">
            <input type="text" id="taskTitle" placeholder="What needs to be done?" maxlength="200">
            <select id="taskPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <input type="date" id="taskDueDate">
            <button id="addBtn" onclick="addTask()">Add Task</button>
        </div>

        <div class="task-filters">
            <input type="text" id="searchInput" placeholder="Search tasks..." oninput="debounceSearch()">
            <select id="filterPriority" onchange="loadTasks()">
                <option value="">All priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <select id="filterStatus" onchange="loadTasks()">
                <option value="">All statuses</option>
                <option value="false">Active</option>
                <option value="true">Completed</option>
            </select>
        </div>

        <div id="taskList" class="task-list">
            <p class="loading">Loading tasks...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
