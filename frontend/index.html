<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFC00">
    <title>TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="Snapchat ghost logo">
                    <path d="M3 21 L3 10 C3 5.5 7 2 12 2 C17 2 21 5.5 21 10 L21 21 C19.5 19.5 18 19.5 16.5 21 C15 22.5 13.5 22.5 12 21 C10.5 19.5 9 19.5 7.5 21 C6 22.5 4.5 22.5 3 21 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                TaskFlow
            </h1>
            <p class="subtitle">Simple task management</p>
        </header>

        <div class="task-form">
            <input type="text" id="taskTitle" placeholder="What needs to be done?" maxlength="200">
            <select id="taskPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <input type="date" id="taskDueDate">
            <button id="addBtn" onclick="addTask()">Add Task</button>
        </div>

        <div class="task-filters">
            <input type="text" id="searchInput" placeholder="Search tasks..." oninput="debounceSearch()">
            <select id="filterPriority" onchange="loadTasks()">
                <option value="">All priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <select id="filterStatus" onchange="loadTasks()">
                <option value="">All statuses</option>
                <option value="false">Active</option>
                <option value="true">Completed</option>
            </select>
        </div>

        <div id="taskList" class="task-list">
            <p class="loading">Loading tasks...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
